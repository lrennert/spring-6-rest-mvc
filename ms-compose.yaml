name: spring-6-microservices
services:
  postgres:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: restadmin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: restdb
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "restadmin", "-d", "restdb" ]
      timeout: 20s
      retries: 10
  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 5s
      timeout: 5s
      retries: 10
  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.3.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_healthy
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
  auth-server:
    container_name: auth-server
    image: spring-6-auth-server:0.0.1-SNAPSHOT
    expose:
      - "9000"
  rest-mvc:
    container_name: rest-mvc
    image: spring-6-rest-mvc:0.0.1-SNAPSHOT
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI=http://auth-server:9000
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/restdb
      - SERVER_PORT=8080
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
  gateway:
    container_name: gateway
    image: spring-6-gateway:0.0.1-SNAPSHOT
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    expose:
      - "8080"
    ports:
      - "8080:8080"
    depends_on:
      - auth-server
      - rest-mvc
  cool-service:
    container_name: cool-service
    image: spring-6-cool-service:0.0.1-SNAPSHOT
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    expose:
      - "8080"
    depends_on:
      - kafka
  cold-service:
    container_name: cold-service
    image: spring-6-cold-service:0.0.1-SNAPSHOT
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    expose:
      - "8080"
    depends_on:
      - kafka
  icecold-service:
    container_name: icecold-service
    image: spring-6-icecold-service:0.0.1-SNAPSHOT
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    expose:
      - "8080"
    depends_on:
      - kafka